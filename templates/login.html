<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Loan Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="
    background: url('/static/bg.jpg') no-repeat center center fixed;
    background-size: cover;
">

<div class="card">

    <h2>Login</h2>

    {% if message %}
        <p style="color:#ff7675; font-weight:bold;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST" onsubmit="saveUser()">

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <a href="/forgot-password"
       class="forgot-pass">
       Forgot Password?
    </a>

    <p style="margin-top:10px;">
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>

<script>
function saveUser() {

    const username =
        document.getElementById("username").value;

    localStorage.setItem(
        "userName",
        username
    );

    localStorage.setItem(
        "userEmail",
        username + "@mail.com"
    );
}
</script>

</body>
</html>
