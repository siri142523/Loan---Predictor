<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification</title>

<style>
html, body{
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
}

body{
    background-image: url("{{ url_for('static', filename='dashboard_bg.jpg') }}");
    background-repeat: no-repeat;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    color: white;
}

/* MAIN CARD */
.verify-card{
    width: 38%;
    margin: 70px auto;
    background: rgba(0,0,0,0.6);
    padding: 35px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

/* HEADING */
.verify-card h2{
    text-align: center;
    margin-bottom: 30px;
    font-size: 26px;
}

/* LABELS */
label{
    font-size: 15px;
    font-weight: bold;
}

/* FILE INPUT */
input[type="file"]{
    width: 100%;
    padding: 10px;
    background: #ffffff;
    color: #000000;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    margin-top: 8px;
}

input[type="file"]::-webkit-file-upload-button{
    background: #6c5ce7;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
}

/* BUTTON */
button{
    width: 100%;
    padding: 14px;
    margin-top: 30px;
    background: linear-gradient(135deg,#00cec9,#0984e3);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="verify-card">

    <h2>Document Verification</h2>

    <p style="
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    width: 70%;
    margin: 10px auto;
">
<b>Note:</b>
Upload a clear Aadhaar and PAN card in PDF / JPG / PNG format.
Maximum file size: 2 MB.
Documents must be readable and issued by Government of India.
</p>

    {% if error %}
<p style="color:#ff6b6b; font-weight:bold; text-align:center;">
    {{ error }}
</p>
{% endif %}

    <form method="POST" enctype="multipart/form-data">

        <label>Upload Aadhaar Card</label>
        <input type="file" name="aadhaar" required>

        <br><br>

        <label>Upload PAN Card</label>
        <input type="file" name="pan" required>

        <button type="submit">Verify Documents</button>
    </form>

</div>

</body>
</html>
