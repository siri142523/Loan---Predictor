<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loan Result</title>

<!-- Chart JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: url('/static/dashboard_bg.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* MAIN CARD */
.result-card{
    width: 90%;
    margin: 40px auto;
    background: rgba(0,0,0,0.65);
    padding: 30px;
    border-radius: 15px;
}

/* HEADER */
.result-header{
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 30px;
}

/* ROW */
.result-row{
    display: flex;
    gap: 30px;
}

/* LEFT */
.left-box{
    width: 50%;
    background: rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 12px;
}

.left-box h3{
    border-bottom: 1px solid #777;
    padding-bottom: 6px;
}

.left-box p{
    margin: 8px 0;
}

/* RIGHT */
.right-box{
    width: 50%;
    background: rgba(255,255,255,0.08);
    padding: 25px;
    border-radius: 12px;
}

/* RISK BAR */
.risk-section{
    margin-top: 35px;
}

.risk-bar-bg{
    width: 100%;
    height: 25px;
    background: #333;
    border-radius: 15px;
    overflow: hidden;
}

.risk-bar{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, green, yellow, red);
    transition: width 1s;
}

.status-text{
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<div class="result-card">

    <div class="result-header">
        Loan Prediction Dashboard
    </div>

    <div class="result-row">

        <!-- LEFT DETAILS -->
        <div class="left-box">
            <h3>Verification</h3>
            <p id="aadhaar"></p>
            <p id="pan"></p>
            <p id="history"></p>

            <h3>User Details</h3>
            <p id="name"></p>
            <p id="age"></p>
            <p id="email"></p>

            <h3>Loan Details</h3>
            <p id="loan_type"></p>
            <p id="income"></p>
            <p id="loan_amount"></p>
            <p id="employment"></p>
        </div>

        <!-- RIGHT GRAPH -->
        <div class="right-box">
            <h3>Risk Analysis</h3>
            <canvas id="riskChart" height="260"></canvas>
        </div>

    </div>

    <!-- RISK BAR -->
    <div class="risk-section">
        <div id="risk_label"></div>
        <div class="risk-bar-bg">
            <div class="risk-bar" id="risk_bar"></div>
        </div>
        <div class="status-text" id="status"></div>
    </div>

</div>

<script>
fetch("/result_data")
.then(res => res.json())
.then(data => {

    // Verification
    document.getElementById("aadhaar").innerText = "Aadhaar: " + data.verification.aadhaar;
    document.getElementById("pan").innerText = "PAN: " + data.verification.pan;
    document.getElementById("history").innerText = "Loan History: " + data.verification.loan_history;

    // User
    document.getElementById("name").innerText = "Name: " + data.loan_data.name;
    document.getElementById("age").innerText = "Age: " + data.loan_data.age;
    document.getElementById("email").innerText = "Email: " + data.loan_data.email;

    // Loan
    document.getElementById("loan_type").innerText = "Loan Type: " + data.loan_data.loan_type;
    document.getElementById("income").innerText = "Income: ₹" + data.loan_data.income;
    document.getElementById("loan_amount").innerText = "Loan Amount: ₹" + data.loan_data.loan_amount;
    document.getElementById("employment").innerText = "Employment: " + data.loan_data.employment;

    // Risk
    document.getElementById("risk_label").innerText = "Risk Score: " + data.risk_score + "%";
    document.getElementById("status").innerText = "Status: " + data.status;
    document.getElementById("risk_bar").style.width = data.risk_score + "%";

    // Graph
    const ctx = document.getElementById('riskChart');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Risk Score'],
            datasets: [{
                label: 'Risk %',
                data: [data.risk_score],
                backgroundColor:
                    data.risk_score < 40 ? 'green' :
                    data.risk_score < 70 ? 'orange' : 'red'
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
});
</script>

</body>
</html>
